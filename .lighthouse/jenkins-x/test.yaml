apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: test
spec:
  pipelineSpec:
    tasks:
    - name: go-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:mikelear/leartech-pipeline-catalog/tasks/go-test/pullrequest.yaml@main
          name: ""
          resources: {}
          workingDir: /workspace/source
          # go-common's code lives under ./pkg/..., not the default
          # ./internal/... — without this scope override, go-test
          # runs against the wrong tree and reports 0% coverage.
          #
          # COVERAGE_THRESHOLD intentionally set LOW (5%) during the
          # test-backfill phase. Reality 2026-05-15: only pkg/tracing
          # has tests (PR#3, ~9% of total pkg surface). Raising the
          # floor before backfilling tests would block ALL new PRs.
          #
          # RATCHET-UP PLAN (per qa-architecture / task #130 backfill):
          #   - After pkg/auth tests land: bump floor → 25%
          #   - After pkg/logger + pkg/lock tests: bump → 40%
          #   - After pkg/mongo + pkg/redis tests: bump → 60% (golden std)
          #
          # Delta-coverage gate (catalog 2026-05-15) catches per-PR
          # regressions — the low floor doesn't open the door for
          # untested new code; it just unblocks PRs against an
          # already-untested baseline.
          env:
          - name: COVERAGE_SCOPE
            value: "./pkg/..."
          - name: COVERAGE_THRESHOLD
            value: "5.0"
        steps:
        - name: ""
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
