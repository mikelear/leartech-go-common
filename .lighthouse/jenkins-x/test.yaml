apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: test
spec:
  pipelineSpec:
    tasks:
    - name: go-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:mikelear/leartech-pipeline-catalog/tasks/go-test/pullrequest.yaml@main
          name: ""
          resources: {}
          workingDir: /workspace/source
          # go-common's code lives under ./pkg/..., not the default
          # ./internal/... — without this scope override, go-test
          # runs against the wrong tree and reports 0% coverage.
          #
          # go-common's code lives under ./pkg/..., so the gate scope
          # is overridden from the default ./internal/...
          #
          # Floor 60% matches the leartech golden-service standard.
          # Backfill landed via task #130 (pkg/redis 100%, pkg/logger 100%,
          # pkg/httptools 91%, pkg/queue 86%, pkg/lock 80%, pkg/tracing 80%,
          # pkg/auth 57%, pkg/mongo 32%, pkg/mongo/migration 18%).
          # Total ~63%. Delta-coverage gate enforces no future regression.
          env:
          - name: COVERAGE_SCOPE
            value: "./pkg/..."
          - name: COVERAGE_THRESHOLD
            value: "60.0"
        steps:
        - name: ""
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
