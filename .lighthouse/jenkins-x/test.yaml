apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: test
spec:
  pipelineSpec:
    tasks:
    - name: go-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:mikelear/leartech-pipeline-catalog/tasks/go-test/pullrequest.yaml@main
          name: ""
          resources: {}
          workingDir: /workspace/source
          # go-common's code lives under ./pkg/..., not the default
          # ./internal/... — without this scope override, go-test
          # runs against the wrong tree and reports 0% coverage.
          # COVERAGE_THRESHOLD kept at 30% during the test-backfill
          # phase (most pkgs have 0 tests today, see task #130).
          # Raise toward 60% as backfill lands.
          env:
          - name: COVERAGE_SCOPE
            value: "./pkg/..."
          - name: COVERAGE_THRESHOLD
            value: "30.0"
        steps:
        - name: ""
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
